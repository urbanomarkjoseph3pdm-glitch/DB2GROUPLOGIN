<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - MyApp</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <div class="navbar">
    <strong><a href="/index.html" style="color:white;text-decoration:none;">MyApp</a></strong>
    <div>
      <a href="/register.html">Register</a>
    </div>
  </div>

  <div class="auth-box">
    <h2>Log In</h2>

    <!-- This form has NO "action" attribute because we submit it
         with JavaScript (fetch) instead of a normal page reload -->
    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" required>

      <button type="submit">Log In</button>
    </form>

    <!-- Success/error messages get printed here by our JS file -->
    <p id="message" class="message"></p>

    <p class="switch-link">Don't have an account? <a href="/register.html">Register</a></p>
  </div>

  <!-- Our JavaScript file that actually talks to the server -->
  <script src="/js/auth.js"></script>
</body>
</html>
