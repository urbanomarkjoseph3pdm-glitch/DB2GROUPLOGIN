<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account - MyApp</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <div class="auth-shell">

    <div class="auth-side">
      <a href="/index.html" class="brand">MyApp</a>
      <blockquote>"One account. Nothing to remember but a password."</blockquote>
      <p class="auth-side-foot">Already registered? <a href="/login.html" style="color:#fff;">Log in</a> instead.</p>
    </div>

    <div class="auth-main">
      <div class="auth-box">
        <h2>Create your account</h2>

        <form id="registerForm">
          <label for="username">Username</label>
          <input type="text" id="username" required>

          <label for="email">Email</label>
          <input type="email" id="email" required>

          <label for="password">Password</label>
          <input type="password" id="password" required minlength="6">

          <button type="submit">Create account</button>
        </form>

        <p id="message" class="message"></p>

        <p class="switch-link">Already have an account? <a href="/login.html">Log in</a></p>
      </div>
    </div>

  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
